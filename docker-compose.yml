services:
  biolog-api:
    build: ./biolog_api
    container_name: biolog-api
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ${BIOLOG_DATA_DIR:-./data}:/data
    environment:
      - DATABASE_PATH=/data/biolog.db
      - TZ=Asia/Tokyo
    restart: unless-stopped
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8766/api/health/health', timeout=5)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  biolog-streamlit:
    build: ./biolog_streamlit
    container_name: biolog-streamlit
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - BIOLOG_API_URL=http://biolog-api:8766
      - TZ=Asia/Tokyo
    depends_on:
      - biolog-api
    restart: unless-stopped
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
